name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repository line endings
        shell: pwsh
        run: ./eng/check-line-endings.ps1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build installer and update packages
        shell: pwsh
        run: ./eng/package.ps1

      - name: Upload unsigned validation package
        uses: actions/upload-artifact@v7
        with:
          name: CastoPet-validation-package
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 7
