name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CastoPet.sln

      - name: Run tests
        run: dotnet run --project tests/CastoPet.Tests/CastoPet.Tests.csproj -c ${{ matrix.configuration }} --no-restore

      - name: Build solution
        run: dotnet build CastoPet.sln -c ${{ matrix.configuration }} --no-restore
